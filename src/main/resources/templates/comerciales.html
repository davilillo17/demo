<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comerciales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-4">
        <div class="row align-items-center mb-4">
            <div class="col">
                <h1 class="h2 mb-0">Comerciales</h1>
            </div>
            <div class="col-auto">
                <a class="btn btn-primary" th:href="@{/comerciales/crear}">Crear comercial</a>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Id</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Apellido 1</th>
                                <th scope="col">Apellido 2</th>
                                <th scope="col">Comisión</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="comercial : ${listaComerciales}">
                                <td th:text="${comercial.id}">0</td>
                                <td th:text="${comercial.nombre}">Nombre</td>
                                <td th:text="${comercial.apellido1}">Apellido 1</td>
                                <td th:text="${comercial.apellido2 ?: '-'}">Apellido 2</td>
                                <td th:text="${comercial.comisión}">0.0</td>
                                <td class="text-nowrap">
                                    <a class="btn btn-sm btn-outline-primary" th:href="@{/comerciales/editor/{id}(id=${comercial.id})}">Editar</a>
                                    <form th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}" method="post" class="d-inline">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
