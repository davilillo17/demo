<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <h1 class="h2 mb-4">Detalle del cliente</h1>
                <dl class="row">
                    <dt class="col-sm-4">Id</dt>
                    <dd class="col-sm-8" th:text="${cliente.id}">0</dd>
                    <dt class="col-sm-4">Nombre</dt>
                    <dd class="col-sm-8" th:text="${cliente.nombre}">Nombre</dd>
                    <dt class="col-sm-4">Primer apellido</dt>
                    <dd class="col-sm-8" th:text="${cliente.apellido1}">Apellido</dd>
                    <dt class="col-sm-4">Segundo apellido</dt>
                    <dd class="col-sm-8" th:text="${cliente.apellido2 ?: '-'}">Apellido</dd>
                    <dt class="col-sm-4">Ciudad</dt>
                    <dd class="col-sm-8" th:text="${cliente.ciudad ?: '-'}">Ciudad</dd>
                    <dt class="col-sm-4">Categoría</dt>
                    <dd class="col-sm-8" th:text="${cliente.categoria}">0</dd>
                </dl>
                <a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver a clientes</a>
            </div>
        </div>
    </main>
</body>
</html>
