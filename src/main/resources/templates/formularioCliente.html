<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente</title>
</head>
<body>
    <h1>Cliente</h1>
    <form th:action="${formAction}" th:object="${cliente}" method="post">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" th:field="*{nombre}" required>

        <label for="apellido1">Primer apellido</label>
        <input id="apellido1" type="text" th:field="*{apellido1}" required>

        <label for="apellido2">Segundo apellido</label>
        <input id="apellido2" type="text" th:field="*{apellido2}">

        <label for="ciudad">Ciudad</label>
        <input id="ciudad" type="text" th:field="*{ciudad}" required>

        <label for="categoria">Categoría</label>
        <input id="categoria" type="number" th:field="*{categoria}" required>

        <button type="submit">Guardar</button>
    </form>
    <a th:href="@{/clientes}">Volver a clientes</a>
</body>
</html>
