<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <h1 class="h2 mb-4">Cliente</h1>
                <form class="row g-3" th:action="${formAction}" th:object="${cliente}" method="post">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input class="form-control" id="nombre" type="text" th:field="*{nombre}" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="apellido1">Primer apellido</label>
                        <input class="form-control" id="apellido1" type="text" th:field="*{apellido1}" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="apellido2">Segundo apellido</label>
                        <input class="form-control" id="apellido2" type="text" th:field="*{apellido2}">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="ciudad">Ciudad</label>
                        <input class="form-control" id="ciudad" type="text" th:field="*{ciudad}" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="categoria">Categoría</label>
                        <input class="form-control" id="categoria" type="number" th:field="*{categoria}" required>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Guardar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver a clientes</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
