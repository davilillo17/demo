<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comercial</title>
</head>
<body>
    <h1>Comercial</h1>
    <form th:action="${formAction}" th:object="${comercial}" method="post">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" th:field="*{nombre}" required>

        <label for="apellido1">Primer apellido</label>
        <input id="apellido1" type="text" th:field="*{apellido1}" required>

        <label for="apellido2">Segundo apellido</label>
        <input id="apellido2" type="text" th:field="*{apellido2}">

        <label for="comision">Comisión</label>
        <input id="comision" type="number" step="any" th:field="*{comisión}" required>

        <button type="submit">Guardar</button>
    </form>
    <a th:href="@{/comerciales}">Volver a comerciales</a>
</body>
</html>
